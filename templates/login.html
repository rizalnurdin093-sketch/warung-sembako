<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Warung Sembako</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a class="brand" href="{{ url_for('kasir') }}">Warung<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="{{ url_for('login') }}">Login</a></li>
    </ul>
  </div>
</nav>
<main class="container">
  <div class="panel" style="max-width: 400px; margin: 8rem auto;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Login</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div style="background: #fee2e2; color: #991b1b; padding: .8rem; border-radius: var(--radius); margin-bottom: 1rem; text-align: center;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST" style="margin-top: 1rem;">
      <div class="form-row">
        <label>Username</label>
        <input type="text" name="username" required style="width: 100%; padding: .6rem .8rem; border: 1px solid var(--border); border-radius: 6px;">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required style="width: 100%; padding: .6rem .8rem; border: 1px solid var(--border); border-radius: 6px;">
      </div>
      <button class="btn-solid" style="width: 100%; margin-top: .8rem;">Login</button>
      <p class="hint" style="margin-top: 1rem; font-size: .75rem; color: var(--soft);">Default username: <code>owner</code> / <code>kasir</code></p>
    </form>
  </div>
</main>
</body>
</html>
